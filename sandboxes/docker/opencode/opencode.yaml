# syntax=docker/sandbox-kit:3
# yaml-language-server: $schema=https://raw.githubusercontent.com/docker/sandbox-kit-spec/main/schema/kit.schema.json
schemaVersion: "3"
kind: mixin
displayName: OpenCode agent
version: "1.0.0"

args:
  auto_start:
    default: "false"
    description: Automatically start opencode when the sandbox starts.
    enum: [ "true", "false" ]
  opencode_version:
    default: "2.3.2"
    description: OpenCode version to install (a mise version ref, e.g. 2.3.2 or latest).

requires: ["mise-en-place"]

capabilities:
  - type: com.docker.sandbox/network-policy@2
    config:
      runtime:
        allow: [ "opencode.ai", "*.opencode.ai" ]

  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        - command: mise use -g "opencode@${{ kit.args.opencode_version }}"
          description: Install OpenCode using mise
          user: "1000"
        - command: |
            if [ "${{ kit.args.auto_start }}" = "true" ]; then
              printf '#!/usr/bin/env bash\nexec opencode\n' > /home/agent/entrypoint.sh
              chmod 0700 /home/agent/entrypoint.sh
            fi
          description: Write the opencode entrypoint override when auto_start is enabled
          user: "1000"
